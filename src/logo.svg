<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ef"/>
      <stop offset="1" stop-color="#d7c8ff"/>
    </linearGradient>
    <radialGradient id="heart" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ff7b9c"/>
      <stop offset="0.55" stop-color="#f0304f"/>
      <stop offset="1" stop-color="#c3102d"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe2c8"/>
      <stop offset="1" stop-color="#f5bf96"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#5a44e6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#6b2a5a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- little sparkles / beats -->
  <g fill="#ff8fb1" opacity="0.85">
    <path d="M86 118 l7 -18 7 18 18 7 -18 7 -7 18 -7 -18 -18 -7z"/>
    <path d="M420 96 l5 -13 5 13 13 5 -13 5 -5 13 -5 -13 -13 -5z"/>
    <path d="M430 300 l5 -12 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5z"/>
  </g>
  <!-- the child -->
  <g filter="url(#soft)">
    <!-- body -->
    <path d="M150 470 C150 380 195 330 256 330 C317 330 362 380 362 470 Z" fill="url(#shirt)"/>
    <!-- head -->
    <circle cx="256" cy="232" r="92" fill="url(#skin)"/>
    <!-- hair -->
    <path d="M166 222 C160 150 214 128 256 128 C306 128 352 156 346 222 C330 190 300 172 262 172 C232 172 204 182 190 200 C182 210 174 216 166 222 Z" fill="#6b3b2a"/>
    <circle cx="180" cy="168" r="24" fill="#6b3b2a"/>
    <circle cx="332" cy="168" r="24" fill="#6b3b2a"/>
    <circle cx="180" cy="168" r="10" fill="#ff5d8f"/>
    <circle cx="332" cy="168" r="10" fill="#ff5d8f"/>
    <!-- face -->
    <ellipse cx="224" cy="238" rx="11" ry="14" fill="#2b1838"/>
    <ellipse cx="288" cy="238" rx="11" ry="14" fill="#2b1838"/>
    <circle cx="228" cy="233" r="4" fill="#fff"/>
    <circle cx="292" cy="233" r="4" fill="#fff"/>
    <ellipse cx="200" cy="268" rx="16" ry="10" fill="#ff9fb4" opacity="0.7"/>
    <ellipse cx="312" cy="268" rx="16" ry="10" fill="#ff9fb4" opacity="0.7"/>
    <path d="M232 274 Q256 296 280 274" stroke="#2b1838" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- big heart hugged in front of the chest -->
  <g filter="url(#soft)">
    <path d="M256 486 C176 430 128 392 128 342 C128 306 156 282 188 282 C216 282 240 298 256 322 C272 298 296 282 324 282 C356 282 384 306 384 342 C384 392 336 430 256 486 Z" fill="url(#heart)"/>
    <!-- shine -->
    <path d="M168 318 C176 302 194 296 208 300" stroke="#ffd0dc" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- heart's cute face -->
    <circle cx="228" cy="370" r="8" fill="#5a0f1f"/>
    <circle cx="284" cy="370" r="8" fill="#5a0f1f"/>
    <path d="M240 392 Q256 406 272 392" stroke="#5a0f1f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- heartbeat line -->
    <path d="M150 432 L196 432 L210 408 L226 452 L240 420 L252 432 L362 432" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>
  <!-- hands hugging the heart -->
  <g fill="url(#skin)" stroke="#e7a77d" stroke-width="3">
    <ellipse cx="142" cy="352" rx="26" ry="20" transform="rotate(-30 142 352)"/>
    <ellipse cx="370" cy="352" rx="26" ry="20" transform="rotate(30 370 352)"/>
  </g>
</svg>
